name: CI Pipeline

on:
  push:
    branches:
  pull_request:
    branches:

jobs:
  build-test-report:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Клонирование репозитория
      - name: Clone test-service repository
        uses: actions/checkout@v4
        with:
            repository: sun6r0/test-service

      # Шаг 2: Установка Java и Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      # Шаг 3: Запуск контейнеров
      - name: Start Docker containers
        run: docker-compose up --build -d

      # Шаг 4: Ожидание готовности сервиса (пример для порта 8080)
      - name: Wait for service to be ready
        run: |
          timeout 120 bash -c 'while ! curl -s http://localhost:8080/health; do sleep 5; done'

      # Шаг 5: Запуск тестов и генерация Allure-результатов
      - name: Run tests with Allure
        run: |
          mvn clean test -Dtest=EntityApiTest
          allure generate target/allure-results --clean -o target/allure-report

      # Шаг 6: Публикация Allure-отчета
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report

      # Шаг 7: Остановка контейнеров (опционально)
      - name: Stop containers
        if: always()
        run: docker-compose down
